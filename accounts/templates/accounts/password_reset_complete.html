{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete - EventEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-ivory: #FAF8F5;
            --primary-emerald: #0A4332;
            --text-dark: #111827;
            --text-muted: #6B7280;
            --font-serif: 'Fraunces', serif;
            --font-sans: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-ivory);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            background: #FFFFFF;
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0,0,0,0.05);
            text-align: center;
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            background: #E8F0EC;
            color: var(--primary-emerald);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 1.5rem auto;
        }

        .brand-logo {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-emerald);
            margin-bottom: 1rem;
        }

        .card-title {
            font-family: var(--font-serif);
            font-size: 1.75rem;
            color: var(--text-dark);
            margin-bottom: 0.75rem;
        }

        .card-subtitle {
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .btn-submit {
            display: inline-block;
            width: 100%;
            background: var(--primary-emerald);
            color: #FFFFFF;
            border: none;
            padding: 0.85rem;
            border-radius: 9999px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn-submit:hover { opacity: 0.95; }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-circle">
            <i class="fa-solid fa-check"></i>
        </div>
        <div class="brand-logo">EventEase</div>
        <h1 class="card-title">Password reset complete</h1>
        <p class="card-subtitle">Your password has been set. You can now log in with your new password.</p>

        <a href="{% url 'accounts:login' %}" class="btn-submit">Sign In</a>
    </div>

</body>
</html>
