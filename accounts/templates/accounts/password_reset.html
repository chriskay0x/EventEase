{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - EventEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-ivory: #FAF8F5;
            --primary-emerald: #0A4332;
            --text-dark: #111827;
            --text-muted: #6B7280;
            --input-bg: #EFECE6;
            --font-serif: 'Fraunces', serif;
            --font-sans: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-ivory);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .reset-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0,0,0,0.05);
            text-align: center;
        }

        .brand-logo {
            font-family: var(--font-serif);
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary-emerald);
            margin-bottom: 1.5rem;
        }

        .reset-title {
            font-family: var(--font-serif);
            font-size: 1.75rem;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .reset-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 2rem;
        }

        .input-field {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid transparent;
            padding: 0.85rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: var(--font-sans);
            color: var(--text-dark);
            outline: none;
            margin-bottom: 1.5rem;
        }

        .input-field:focus { border-color: var(--primary-emerald); }

        .btn-submit {
            width: 100%;
            background: var(--primary-emerald);
            color: #FFFFFF;
            border: none;
            padding: 0.85rem;
            border-radius: 9999px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 1.5rem;
        }

        .btn-submit:hover { opacity: 0.95; }

        .back-link {
            color: var(--text-muted);
            font-size: 0.88rem;
            text-decoration: none;
        }

        .back-link:hover { color: var(--text-dark); text-decoration: underline; }
    </style>
</head>
<body>

    <div class="reset-card">
        <div class="brand-logo">EventEase</div>
        <h1 class="reset-title">Reset Password</h1>
        <p class="reset-subtitle">Enter the email associated with your account and we'll send you a link to reset your password.</p>

        <form method="post">
            {% csrf_token %}
            <input type="email" name="email" class="input-field" placeholder="Email Address" required>
            <button type="submit" class="btn-submit">Send Reset Link</button>
        </form>

        <a href="{% url 'accounts:login' %}" class="back-link">&larr; Back to Log In</a>
    </div>

</body>
</html>
