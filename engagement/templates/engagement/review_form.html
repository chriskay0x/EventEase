<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EventEase - Review Experience</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#707974", "secondary": "#755a26", "primary-container": "#064e3b",
                        "surface-tint": "#2b6954", "on-secondary": "#ffffff", "secondary-fixed-dim": "#e5c183",
                        "on-error-container": "#93000a", "surface-container-highest": "#e5e2dd",
                        "surface-bright": "#fcf9f4", "background": "#fcf9f4", "on-primary-container": "#80bea6",
                        "surface-container": "#f0ede9", "inverse-primary": "#95d3ba", "tertiary-fixed": "#e4e2e1",
                        "on-secondary-fixed-variant": "#5b4310", "secondary-container": "#fdd897",
                        "on-surface-variant": "#404944", "tertiary": "#2e2e2e", "primary-fixed": "#b0f0d6",
                        "surface-container-high": "#ebe8e3", "on-primary-fixed": "#002117", "outline-variant": "#bfc9c3",
                        "tertiary-container": "#444444", "on-tertiary-container": "#b3b1b1",
                        "inverse-on-surface": "#f3f0eb", "on-primary-fixed-variant": "#0b513d",
                        "on-secondary-fixed": "#271900", "surface-dim": "#dcdad5", "surface-variant": "#e5e2dd",
                        "surface": "#fcf9f4", "on-tertiary-fixed": "#1b1c1c", "secondary-fixed": "#ffdea8",
                        "error-container": "#ffdad6", "on-error": "#ffffff", "primary-fixed-dim": "#95d3ba",
                        "on-background": "#1c1c19", "surface-container-low": "#f6f3ee",
                        "on-tertiary-fixed-variant": "#474747", "primary": "#003527", "tertiary-fixed-dim": "#c8c6c6",
                        "on-tertiary": "#ffffff", "surface-container-lowest": "#ffffff", "on-surface": "#1c1c19",
                        "error": "#ba1a1a", "on-primary": "#ffffff", "on-secondary-container": "#785c28",
                        "inverse-surface": "#31302d"
                    },
                    "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    "spacing": {
                        "margin-mobile": "16px", "gutter": "24px", "margin-desktop": "48px", "section-gap": "80px",
                        "stack-sm": "8px", "stack-md": "16px", "stack-lg": "32px", "container-max": "1280px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"], "label-caps": ["Inter"], "display-lg-mobile": ["Playfair Display"],
                        "headline-md": ["Playfair Display"], "body-lg": ["Inter"], "headline-sm": ["Playfair Display"],
                        "body-md": ["Inter"], "display-lg": ["Playfair Display"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "headline-md": ["32px", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-sm": ["24px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .star-rating .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300; transition: all 0.3s ease; }
        .star-rating.filled .material-symbols-outlined,
        .star-rating:hover .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400; color: #A1824A; }
        .input-halo:focus-within { box-shadow: 0 1px 0 0 #064e3b; }
</style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased text-on-background selection:bg-secondary-container selection:text-on-secondary-fixed">
<main class="w-full max-w-xl">
<div class="glass-panel rounded-xl shadow-[0_4px_20px_rgba(45,45,45,0.08)] border border-surface-variant p-8 md:p-12">
<header class="text-center mb-10">
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">How was your celebration?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your feedback helps curate the perfect experience.</p>
</header>

{% if messages %}
<div class="mb-6">
{% for message in messages %}
<div class="px-4 py-2 rounded-lg {% if message.tags == 'error' %}bg-error-container text-on-error-container{% else %}bg-surface-container-high text-on-surface{% endif %} mb-2">
{{ message }}
</div>
{% endfor %}
</div>
{% endif %}

<div class="flex items-center gap-4 p-4 mb-10 bg-surface-container-low rounded-xl border border-surface-variant/50">
<div class="w-16 h-16 rounded-full overflow-hidden shrink-0">
<img class="w-full h-full object-cover" alt="Vendor" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDX_GHujplpMMpOJrQL4LyB_iYH0bkXUkSSaqxl8cF6cS0bQV6ZwcPdvL_ztiNnli47lUWqbwoHzYufHyNGFUuKnRoaR5TwM1Tsh3H2rqU0h8hzOaIjCQ-geA7Ogc6CJu7pbmMqUsI3taBWAVdmJ_e8yWIB4y-dQMiQf7TMMACuiDiOXWAmdNBMcIG3OAQqCgZQYG2BmBcq3gzppckKZb0DtH58STXSfMHeFidumSXyLFj9BnQT4UMiuA"/>
</div>
<div>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Lumina Floral Studio</h2>
<p class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[16px]">verified</span>
                        Verified Partner
                    </p>
</div>
</div>

<form class="flex flex-col gap-8" id="reviewForm" method="post" action="{% url 'submit_review' booking_id=booking_id %}">
{% csrf_token %}
<div class="flex flex-col items-center gap-4">
<label class="font-label-caps text-label-caps text-outline uppercase tracking-widest">Rate your experience</label>
<div class="flex gap-2" id="starContainer">
<button class="star-rating group p-1 focus:outline-none" data-value="1" type="button">
<span class="material-symbols-outlined text-4xl text-outline-variant group-hover:text-secondary group-hover:scale-110">star</span>
</button>
<button class="star-rating group p-1 focus:outline-none" data-value="2" type="button">
<span class="material-symbols-outlined text-4xl text-outline-variant group-hover:text-secondary group-hover:scale-110">star</span>
</button>
<button class="star-rating group p-1 focus:outline-none" data-value="3" type="button">
<span class="material-symbols-outlined text-4xl text-outline-variant group-hover:text-secondary group-hover:scale-110">star</span>
</button>
<button class="star-rating group p-1 focus:outline-none" data-value="4" type="button">
<span class="material-symbols-outlined text-4xl text-outline-variant group-hover:text-secondary group-hover:scale-110">star</span>
</button>
<button class="star-rating group p-1 focus:outline-none" data-value="5" type="button">
<span class="material-symbols-outlined text-4xl text-outline-variant group-hover:text-secondary group-hover:scale-110">star</span>
</button>
</div>
<input id="ratingValue" name="rating" type="hidden" value="0"/>
</div>
<div class="relative group input-halo border-b border-outline-variant bg-surface-container-low transition-colors duration-300 rounded-t-lg">
<label class="absolute left-4 top-3 font-label-md text-label-md text-outline-variant transition-all duration-200 transform origin-left peer-focus:-translate-y-2 peer-focus:scale-75 peer-focus:text-primary-container peer-valid:-translate-y-2 peer-valid:scale-75" for="reviewComment">Share your experience...</label>
<textarea class="peer w-full bg-transparent border-none focus:ring-0 resize-none font-body-md text-body-md text-on-surface pt-8 pb-3 px-4 h-32" id="reviewComment" name="comment" required></textarea>
</div>
<div class="flex flex-col gap-4 mt-4">
<button class="w-full rounded-full bg-primary-container text-[#ffffff] py-4 px-8 font-label-md text-label-md hover:bg-surface-tint transition-all duration-300 shadow-sm hover:shadow-md active:scale-[0.98]" type="submit">
                        Submit Review
                    </button>
<a href="{% url 'platform_overview' %}" class="w-full text-center py-3 font-label-md text-label-md text-outline hover:text-on-surface transition-colors duration-300">
                        Skip for now
                    </a>
</div>
</form>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const stars = document.querySelectorAll('.star-rating');
            const ratingInput = document.getElementById('ratingValue');
            const starContainer = document.getElementById('starContainer');
            const form = document.getElementById('reviewForm');

            function updateStars(value) {
                stars.forEach((star, index) => {
                    const icon = star.querySelector('.material-symbols-outlined');
                    if (index < value) {
                        icon.style.fontVariationSettings = "'FILL' 1, 'wght' 400";
                        icon.style.color = "#A1824A";
                    } else {
                        icon.style.fontVariationSettings = "'FILL' 0, 'wght' 300";
                        icon.style.color = "";
                    }
                });
            }

            stars.forEach(star => {
                star.addEventListener('mouseover', function() {
                    updateStars(this.getAttribute('data-value'));
                });
                star.addEventListener('click', function() {
                    const value = this.getAttribute('data-value');
                    ratingInput.value = value;
                    updateStars(value);
                });
            });

            starContainer.addEventListener('mouseleave', function() {
                updateStars(ratingInput.value);
            });

            const textarea = document.getElementById('reviewComment');
            textarea.addEventListener('input', function() {
                if (this.value.trim() !== '') {
                    this.setAttribute('valid', 'true');
                } else {
                    this.removeAttribute('valid');
                }
            });

            form.addEventListener('submit', function(e) {
                if (ratingInput.value === '0') {
                    e.preventDefault();
                    alert('Please select a star rating before submitting.');
                }
            });
        });
    </script>
</body></html>
