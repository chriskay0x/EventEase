<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Write Review</title>
</head>
<body>

    <h1>Write a Review</h1>

    <form method="POST">
        {% csrf_token %}

        <label for="vendor">
            Vendor
        </label>

        <select name="vendor" id="vendor" required>
            <option value="">Select vendor</option>

            {% for user in users %}
                <option value="{{ user.id }}">
                    {{ user.username }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        {{ form.as_p }}

        <button type="submit">
            Submit Review
        </button>
    </form>

    <br>

    <a href="{% url 'engagement:review_list' %}">
        Back to Reviews
    </a>

</body>
</html>
