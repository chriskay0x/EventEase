<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Send Message</title>
</head>
<body>

    <h1>Send Message</h1>

    <form method="POST">
        {% csrf_token %}

        <label for="recipient">Recipient</label>

        <select name="recipient" id="recipient" required>
            <option value="">Select recipient</option>

            {% for user in users %}
                <option value="{{ user.id }}">
                    {{ user.username }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label for="body">Message</label>

        <textarea
            name="body"
            id="body"
            rows="6"
            maxlength="2000"
            required
        ></textarea>

        <br><br>

        <button type="submit">
            Send Message
        </button>
    </form>

    <br>

    <a href="{% url 'engagement:message_list' %}">
        Back to Messages
    </a>

</body>
</html>
