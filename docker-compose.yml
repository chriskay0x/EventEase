version: '3.8'

services:
  db:
    image: postgres:16
    container_name: eventease_db
    restart: always
    environment:
      POSTGRES_DB: eventease_db
      POSTGRES_USER: eventease_user
      POSTGRES_PASSWORD: eventease_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: